<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#66784d"
  >

  <meta
    name="description"
    content="MAKARIA — onde prosperidade encontra plenitude."
  >

  <title>MAKARIA</title>


  <!-- favicon -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="./logo.svg"
  >


  <!-- estilos -->

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div id="toast"></div>


  <!-- =====================================================
       AUTENTICAÇÃO
  ====================================================== -->

  <section
    id="auth"
    class="auth"
  >

    <div class="auth-card">


      <!-- marca -->

      <div class="brand">

        <img
          src="./logo.svg"
          alt="MAKARIA"
        >

        <div>

          <b>MAKARIA</b>

          <small>
            onde prosperidade encontra plenitude.
          </small>

        </div>

      </div>


      <!-- apresentação -->

      <div class="hero">

        <h1>
          Seu dinheiro, com propósito.
        </h1>

        <p>
          Organize entradas, gastos, metas e investimentos
          em um só lugar.
        </p>

      </div>


      <!-- abas -->

      <div class="tabs">

        <button
          type="button"
          class="active"
          data-mode="login"
        >
          Entrar
        </button>

        <button
          type="button"
          data-mode="signup"
        >
          Criar conta
        </button>

      </div>


      <!-- formulário -->

      <form id="authForm">


        <!-- nome -->

        <label
          id="nameBox"
          class="hide"
        >

          Nome completo

          <input
            id="name"
            type="text"
            autocomplete="name"
          >

        </label>


        <!-- e-mail -->

        <label>

          E-mail

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >

        </label>


        <!-- senha -->

        <label>

          Senha

          <input
            id="pass"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
          >

        </label>


        <!-- botão -->

        <button
          class="primary"
          id="authBtn"
          type="submit"
        >
          Entrar
        </button>


        <!-- mensagem -->

        <p id="authMsg"></p>


      </form>


      <!-- assinatura -->

      <small class="sign">
        criado por Mirela Catherine.
      </small>


    </div>

  </section>



  <!-- =====================================================
       APLICAÇÃO
  ====================================================== -->

  <section
    id="app"
    class="hide"
  >


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header>


      <!-- logo -->

      <div class="brand mini">

        <img
          src="./logo.svg"
          alt="MAKARIA"
        >

        <b>
          MAKARIA
        </b>

      </div>


      <!-- controles -->

      <div class="head">

        <span id="hello"></span>

        <button
          id="theme"
          type="button"
          aria-label="Alternar tema"
        >
          ☾
        </button>

        <button
          id="logout"
          type="button"
        >
          Sair
        </button>

      </div>


    </header>



    <!-- ===================================================
         LAYOUT
    ==================================================== -->

    <div class="layout">


      <!-- =================================================
           MENU
      ================================================== -->

      <aside>

        <nav>


          <button
            type="button"
            class="active"
            data-page="home"
          >
            ⌂
            <span>
              Visão geral
            </span>
          </button>


          <button
            type="button"
            data-page="transactions"
          >
            ↕
            <span>
              Transações
            </span>
          </button>


          <button
            type="button"
            data-page="goals"
          >
            ◎
            <span>
              Metas
            </span>
          </button>


          <button
            type="button"
            data-page="accounts"
          >
            ▣
            <span>
              Contas
            </span>
          </button>


          <button
            type="button"
            data-page="cards"
          >
            ▤
            <span>
              Cartões
            </span>
          </button>


          <button
            type="button"
            data-page="salary"
          >
            ▰
            <span>
              Salário
            </span>
          </button>


          <button
            type="button"
            data-page="categories"
          >
            ◈
            <span>
              Categorias
            </span>
          </button>


        </nav>


        <small>
          MAKARIA · criado por Mirela Catherine
        </small>


      </aside>



      <!-- =================================================
           CONTEÚDO
      ================================================== -->

      <main id="main"></main>


    </div>


  </section>



  <!-- =====================================================
       APPWRITE WEB SDK
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"
  ></script>


  <!-- =====================================================
       MAKARIA APP
  ====================================================== -->

  <script
    type="module"
    src="./app.js"
  ></script>


</body>

</html>
